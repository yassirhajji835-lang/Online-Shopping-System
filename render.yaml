# Classroom PostgreSQL deployment
services:
  - type: web
    name: yassir-online-shopping-demo
    runtime: python
    plan: free
    region: oregon
    branch: postgres-migration
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SHOP_RENDER_DEMO
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: online-shopping-db
          property: connectionString
      - key: SHOP_HTTPS
        value: "1"
      - key: SHOP_SECRET
        generateValue: true
      - key: SHOP_ADMIN_EMAIL
        sync: false
      - key: SHOP_ADMIN_PASSWORD
        sync: false

databases:
  - name: online-shopping-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
