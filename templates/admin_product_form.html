{% extends 'base.html' %}{% block title %}{{title}}{% endblock %}{% block content %}<a class="breadcrumb" href="/admin/products">← Back to products</a><div class="pagehead"><span class="eyebrow muted">ADMINISTRATION</span><h1>{{title}}</h1><p>Edit product information and inventory.</p></div><section class="panel pad narrow"><form action="/admin/products/save" method="post" class="formstack"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="pid" value="{{product.id if product else ''}}"><label>Product name<input class="input" name="name" value="{{product.name if product else ''}}" minlength="2" maxlength="130" required></label><label>Description<textarea class="input" name="description" rows="4" maxlength="1500">{{product.description if product else ''}}</textarea></label><label>Category<select class="input" name="category_id" required>{% for cat in categories %}<option value="{{cat.id}}" {% if product and product.category_id == cat.id %}selected{% endif %}>{{cat.name}}</option>{% endfor %}</select></label><div class="formgrid"><label>Price (USD)<input class="input" type="number" name="price" min="0" step="0.01" value="{{'%.2f' % (product.price_cents / 100) if product else ''}}" required></label><label>Stock<input class="input" type="number" name="stock" min="0" step="1" value="{{product.stock if product else 0}}" required></label></div><label>Product image URL (optional)<input class="input" name="image_url" maxlength="500" placeholder="https://images.unsplash.com/..." value="{{product.image_url if product else ''}}"><small class="muted">Paste an HTTPS image URL, use a short emoji, or leave blank for an automatic demo photo when the product name matches a sample category.</small></label><label class="checklabel"><input type="checkbox" name="is_active" value="1" {% if not product or product.is_active %}checked{% endif %}>Visible to customers</label><button type="submit" class="btn btn-dark">Save product →</button></form></section>{% endblock %}
